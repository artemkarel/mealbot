<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>План питания</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
@import url('https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
*,*::before,*::after{box-sizing:border-box}
.boot{font-family:'Golos Text',system-ui,sans-serif;padding:40px;text-align:center;color:#68786D}
.root{
  /* цвета взяты прямо с аватарки: фон, зелень тарелки и янтарная точка */
  --bg:#EEF1EC; --surface:#fff; --ink:#16241E; --muted:#68786D; --line:#DCE3D8;
  --brand:#33624F; --amber:#C9873A;
  font-family:'Golos Text',system-ui,-apple-system,sans-serif;
  color:var(--ink); background:var(--bg); min-height:100vh; -webkit-font-smoothing:antialiased;
}
.mono,.dose,.row-q,.card-out,.trip-c,.num{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3,.day-name,.planbar-t,.trip-n{font-family:'Literata',Georgia,serif;font-weight:600;letter-spacing:-.01em}

/* шапка */
.hdr{position:sticky;top:0;z-index:20;background:rgba(238,241,236,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px 8px;max-width:720px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;flex:0 0 auto}
.hdr h1{margin:0;font-size:20px}
.hdr-sub{margin:1px 0 0;font-size:12px;color:var(--muted)}
.hdr-right{display:flex;align-items:center;gap:8px}
.counter{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.counter button{width:28px;height:28px;border:none;background:transparent;color:var(--brand);font-size:16px;cursor:pointer;border-radius:50%;line-height:1}
.counter button:active{background:var(--line)}
.counter .num{min-width:20px;text-align:center;font-size:13px}
.counter-big{display:inline-flex;transform:scale(1.15);margin:4px 0 0 6px}
.gear{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:15px;color:var(--brand)}
.tabs{display:flex;gap:2px;padding:0 16px;max-width:720px;margin:0 auto}
.tabs button{flex:1;border:none;background:transparent;font-family:inherit;font-size:13.5px;color:var(--muted);padding:9px 4px 11px;cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--brand);font-weight:500}

.main{max-width:720px;margin:0 auto;padding:16px 16px 56px}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}

/* штамп «готовим / не готовим» */
.stamp-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.stamp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:3px;border:1px dashed}
.stamp-cook{color:var(--accent);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.stamp-keep{color:var(--muted);border-color:var(--line);background:var(--surface)}
.stamp-note{font-size:12px;color:var(--muted)}

/* карточка дня */
.day{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.day-big{padding:16px}
.day-name{font-size:17px;margin-bottom:6px}
.meal{padding:9px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:none}
.slot{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.dishes{list-style:none;margin:0;padding:0}
.dishes li{display:flex;gap:12px;align-items:baseline;justify-content:space-between;padding:2px 0}
.d-name{font-size:14px;line-height:1.35}
.dose{font-size:12px;color:var(--muted);white-space:nowrap}
.supp-li .d-name{color:var(--amber)}
.rx{margin-left:7px;border:1px solid var(--line);background:transparent;color:var(--brand);font-family:inherit;font-size:10px;padding:1px 7px;border-radius:999px;cursor:pointer}
.rec-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}

/* меню: блоки по два дня */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip.on{border-color:var(--c);color:#fff;background:var(--c)}
.chip-add{border-style:dashed;color:var(--muted)}
.planbar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.planbar-t{font-size:16px}
.planbar-d{font-size:12px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);line-height:1.45;margin:0 0 12px;padding-left:2px}
.note-warn{color:var(--amber);margin-top:8px}
.block{position:relative}
.block-pair{padding-left:26px}
.block-rail{position:absolute;left:0;top:6px;bottom:16px;width:16px;border-left:2px solid var(--c);border-top:2px solid var(--c);border-bottom:2px solid var(--c);border-radius:6px 0 0 6px;opacity:.45}
.block-rail span{position:absolute;left:6px;top:50%;transform:translateY(-50%) rotate(180deg);writing-mode:vertical-rl;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--c);white-space:nowrap}
.repeat{font-size:12.5px;color:var(--muted);padding:6px 0 12px 4px}

/* закупки */
.gauge{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.gauge-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}
.gauge-bar{height:6px;background:var(--bg);border-radius:999px;overflow:hidden}
.gauge-bar i{display:block;height:100%;background:var(--c);transition:width .3s ease}
.gauge-sub{font-size:11.5px;color:var(--muted);margin-top:6px}
.trips{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.trip{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:10px;padding:14px;cursor:pointer;font-family:inherit}
.trip:active{transform:scale(.995)}
.trip-n{font-size:16px;color:var(--ink)}
.trip-w{font-size:12px;color:var(--muted)}
.trip-c{font-size:13px;color:var(--muted)}
.trip-c.ok{color:var(--c)}
.triphead{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.back{border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:13px;cursor:pointer;padding:0 0 10px}
.toolbar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tool{border:1px solid var(--line);background:var(--surface);color:var(--muted);font-family:inherit;font-size:12.5px;padding:6px 11px;border-radius:999px;cursor:pointer}
.tool.on{background:var(--brand);border-color:var(--brand);color:#fff}
.grp{margin-bottom:14px}
.grp-h{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px 2px;font-family:'Golos Text',sans-serif;font-weight:500}
.grp-body{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:none}
.row input{position:absolute;opacity:0;width:0;height:0}
.tick{width:19px;height:19px;border-radius:5px;border:1.5px solid #C3CCC4;display:grid;place-items:center;flex:0 0 auto;transition:background .12s,border-color .12s}
.tick::after{content:"";width:4px;height:9px;margin-top:-2px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) scale(0);transition:transform .12s}
.row input:checked + .tick{background:var(--brand);border-color:var(--brand)}
.row input:checked + .tick::after{transform:rotate(45deg) scale(1)}
.row input:focus-visible + .tick{outline:2px solid var(--brand);outline-offset:2px}
.row-main{min-width:0}
.row-n{font-size:14px;line-height:1.3;display:block}
.row-m{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.tag{font-size:10px;color:var(--muted);border:1px solid var(--line);padding:0 6px;border-radius:999px}
.row-note{font-size:11px;color:var(--muted)}
.row-q{font-size:12.5px;white-space:nowrap}
.row.done .row-n,.row.done .row-q{color:#AEB8B0;text-decoration:line-through}
.del{border:none;background:transparent;color:#B9C2BA;font-size:18px;cursor:pointer;padding:0 2px;line-height:1}
.done-all{text-align:center;color:var(--muted);font-size:13px;padding:8px 0}

/* кнопки, формы */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:inherit;font-size:13.5px;padding:9px 14px;border-radius:8px;cursor:pointer}
.btn:active{transform:scale(.99)}
.btn-on{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-ghost{background:transparent;color:var(--muted)}
.btn-wide{display:block;width:100%;margin-bottom:8px}
.add{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.add textarea,.add input{width:100%;font-family:inherit;font-size:14px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);resize:vertical}
.add-btns{display:flex;gap:8px}
.hint{font-size:12px;color:var(--muted);line-height:1.45;margin:4px 0 14px}

/* карточки рецептов */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card h3{margin:0;font-size:16px}
.card-out{font-size:11.5px;color:var(--muted);white-space:nowrap}
.card h4,.sheet h4{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;font-family:'Golos Text',sans-serif;font-weight:500}
.bul{margin:0;padding-left:16px}
.bul li{font-size:13.5px;line-height:1.5}
.steps{margin:0;padding-left:18px}
.steps li{font-size:13.5px;line-height:1.5;padding-left:2px;margin-bottom:4px}
.own{white-space:pre-wrap;font-size:13.5px;line-height:1.55;margin:8px 0}

/* шторки */
.sheet-wrap{position:fixed;inset:0;background:rgba(22,36,30,.42);display:flex;align-items:flex-end;justify-content:center;z-index:40;animation:fade .18s ease}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:88vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px 16px 32px;animation:rise .22s cubic-bezier(.2,.8,.3,1)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-16px;background:var(--bg);padding:4px 0 8px;margin:-4px 0 4px}
.sheet-h h2{margin:0;font-size:18px}
.x{border:none;background:transparent;font-size:24px;color:var(--muted);cursor:pointer;line-height:1;padding:0 4px}
.supp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.supp-h{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.slots{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.slot-b{border:1px solid var(--line);background:transparent;color:var(--muted);font-family:inherit;font-size:11.5px;padding:4px 9px;border-radius:999px;cursor:pointer}
.slot-b.on{background:var(--amber);border-color:var(--amber);color:#fff}
.gen-day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.gen-name{font-size:13px;font-weight:600;margin-bottom:6px}
.gen-meal{display:flex;gap:10px;font-size:12.5px;line-height:1.4;padding:2px 0}
.gen-meal .slot{flex:0 0 62px;margin:0}

@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(18px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:520px){
  .dishes li{flex-direction:column;gap:0}
  .dose{font-size:11.5px}
  .row{grid-template-columns:auto 1fr auto}
  .row .del{grid-column:4}
}

.busy{position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--brand);opacity:.6;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.2}}
.slot-b.t{border-style:dashed}
.hdr{position:relative}
body{margin:0;background:#EEF1EC}

/* «что приготовить» */
.cook{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.cook-h{font-family:'Literata',Georgia,serif;font-size:15px;font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cook-sub{font-family:'Golos Text',sans-serif;font-size:11.5px;color:var(--muted);font-weight:400;white-space:nowrap}
.cook-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:none;border-right:none;border-bottom:none;font-family:inherit;cursor:default}
.cook-rec{cursor:pointer}
.cook-n{font-size:14px;color:var(--ink);min-width:0}
.cook-d{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.cook-q{text-align:right;white-space:nowrap}
.cook-q b{font-size:14px}
.cook-u{font-size:10.5px;color:var(--muted);margin-left:4px}
.cook-out{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.cook-link{font-size:12.5px;color:var(--brand)}
.cook-quiet{border-left-color:var(--line);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.cook-switch{display:flex;gap:4px;background:var(--bg);border-radius:8px;padding:3px;margin-bottom:6px}
.cook-switch button{flex:1;border:none;background:transparent;font-family:inherit;font-size:12.5px;color:var(--muted);padding:6px 8px;border-radius:6px;cursor:pointer}
.cook-switch button.on{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* раскрывающиеся заходы */
.trip-box{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:10px;overflow:hidden}
.trip-box.open{box-shadow:0 2px 10px rgba(22,36,30,.06)}
.trip-box .trip{border:none;border-radius:0;background:none;width:100%}
.trip-r{display:flex;align-items:center;gap:8px}
.chev{color:var(--muted);font-size:12px;transition:transform .18s ease;display:inline-block}
.trip-box.open .chev{transform:rotate(180deg)}
.trip-body{padding:0 12px 12px;animation:drop .18s ease}
.trip-body .grp{margin-bottom:10px}
.trip-body .grp-body{border-radius:8px}
@keyframes drop{from{opacity:.4;transform:translateY(-4px)}}
</style>
</head>

<script>/* Приложение плана питания внутри Telegram.
   Данные берёт с сервера бота, поэтому всё совпадает с тем, что в чате. */
const { h, render } = preact;
const { useState, useEffect, useMemo } = preactHooks;
const html = htm.bind(h);

const tg = window.Telegram?.WebApp;
const INIT = tg?.initData || "";

/* ---------- справочники ---------- */
const SLOTS = ["Завтрак", "Обед", "Полдник", "Ужин", "2-й ужин"];
const WEEKDAYS = ["Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота", "Воскресенье"];
const MONTHS = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const BLOCKS = [["Понедельник","Вторник"],["Среда","Четверг"],["Пятница","Суббота"],["Воскресенье"]];
const STORE_DEFAULT = {
  "Крупы и лапша":"Супермаркет","Хлеб и выпечка":"ВкусВилл","Молочное / замена, сыр":"ВкусВилл",
  "Козье молочное и яйца":"ВкусВилл","Рыба, мясо, морепродукты":"Супермаркет","Рыба, мясо, яйца":"Супермаркет",
  "Овощи, фрукты, зелень":"Рынок / супермаркет","Готовое, напитки, бакалея":"Супермаркет","Своё":"Супермаркет"};
const STORE_ORDER = ["Поставщик","ВкусВилл","Эко-маркет","Рынок / супермаркет","Супермаркет","idietum","Ozon/WB"];
const PREORDER = ["Поставщик","Ozon/WB","idietum"];
const CAT_ORDER = ["Крупы и лапша","Хлеб и выпечка","Молочное / замена, сыр","Козье молочное и яйца",
  "Рыба, мясо, морепродукты","Рыба, мясо, яйца","Овощи, фрукты, зелень","Готовое, напитки, бакалея","Своё"];
const PANTRY = ["Крупы и лапша","Готовое, напитки, бакалея"];
const TRIPS = [{id:1,name:"Закуп 1",when:"начало недели"},{id:2,name:"Закуп 2",when:"середина недели"},
               {id:"p",name:"Заказать заранее",when:"поставщик и доставка"}];
const RECIPE_PREFIX = [["Овощной суп на костном бульоне","veg"],["Уха","uha"],["Венские вафли","vafli"],["Морковная запеканка","zap"]];
const TIMING = {before:"до еды", with:"во время еды", after:"после еды"};
const TIMING_ORDER = ["before","with","after",""];

/* ---------- помощники ---------- */
const storeOf = (badge, cat) => badge || STORE_DEFAULT[cat] || "Супермаркет";
const catRank = c => { const i = CAT_ORDER.indexOf(c); return i < 0 ? 99 : i; };
const storeRank = s => { const i = STORE_ORDER.indexOf(s); return i < 0 ? 99 : i; };
const splitDish = s => { const i = s.indexOf(" — "); return i < 0 ? [s,""] : [s.slice(0,i), s.slice(i+3)]; };
const sameMeals = (a,b) => a && b && JSON.stringify(a.meals) === JSON.stringify(b.meals);
function fmtQty(qty, unit, people) {
  if (qty === null || qty === undefined) return "";
  const t = qty * people;
  return (unit === "г" || unit === "мл") ? `${Math.round(t/10)*10} ${unit}` : `${Math.ceil(t)} ${unit}`;
}
function recipeIdFor(dish) { for (const [p,id] of RECIPE_PREFIX) if (dish.startsWith(p)) return id; return null; }
const isPantry = (cat,name) => PANTRY.includes(cat) ? true : (cat === "Хлеб и выпечка" ? !name.includes("Тартин") : false);

/* ---------- связь с сервером ---------- */
async function api(path, payload) {
  const r = await fetch("/api/" + path, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ initData: INIT, ...payload }),
  });
  if (!r.ok) throw new Error(r.status === 401 ? "Не удалось подтвердить, что это ты. Открой приложение из бота." : "Сервер недоступен");
  return r.json();
}

/* ---------- сколько варить ---------- */
function parseAmount(dish) {          // «Отварная гречка — 180 г» -> {n:180, unit:"г"}
  const m = dish.match(/—\s*(\d+)(?:\s*[–-]\s*\d+)?\s*(г|мл|шт)(?![а-я])/);
  return m ? { n: parseInt(m[1], 10), unit: m[2] } : null;
}

function cookPlan(plan, day, people, table, forceDays) {
  const i = plan.days.findIndex(d => d.name === day.name);
  const repeat = sameMeals(day, plan.days[i-1]);
  let block = 1;                      // сколько дней подряд едим то же самое
  while (plan.days[i+block] && sameMeals(day, plan.days[i+block])) block++;
  const days = forceDays || block;    // можно готовить не на весь блок

  const agg = new Map();
  day.meals.forEach(m => m.d.forEach(dish => {
    if (/^(Вода|Кофе|Зелёный чай|Ромашковый чай)/.test(dish)) return;   // заваривается по чашке
    const ing = table[dish] || [];
    const amount = parseAmount(dish);
    let dry = 0, raw = 0, pieces = 0;
    ing.forEach(([cat, name, badge, unit, qty, note]) => {
      if (qty === null || qty === undefined) return;
      if (unit === "шт") { pieces += qty; return; }                   // считаем штуками
      if (unit !== "г") return;
      if (cat === "Крупы и лапша") dry += qty;                        // варим из сухого
      else if ((note || "").includes("сырой вес")) raw += qty;        // усохнет при готовке
    });
    if (!amount && !dry && !raw && !ing.some(x => x[4])) return;      // готовить нечего
    const name = splitDish(dish)[0];
    if (!agg.has(name)) agg.set(name, {name, rid: recipeIdFor(dish), amount, dry:0, raw:0, pieces:0, n:0, slots:new Set()});
    const a = agg.get(name);
    a.n += 1; a.dry += dry; a.raw += raw; a.pieces += pieces; a.slots.add(m.t);
  }));

  const items = [...agg.values()].map(a => {
    const k = people * days * a.n;                    // порций всего
    // штучное показываем штуками: «4 шт» понятнее, чем «1000 г»
    const byPiece = a.pieces > 0 && a.amount?.unit !== "шт";
    return { ...a,
             total: byPiece ? Math.ceil(a.pieces * people * days) : (a.amount ? a.amount.n * k : 0),
             unit: byPiece ? "шт" : (a.amount?.unit || ""),
             base: a.amount?.n || 0, baseUnit: a.amount?.unit || "",   // единица из меню, не итоговая
             portions: k,
             dryTotal: Math.round(a.dry * people * days / 5) * 5,
             rawTotal: Math.round(a.raw * people * days / 10) * 10 };
  });
  return { days, block, repeat, items };
}

/* ---------- случайное меню ---------- */
function shopForDays(days, table) {
  const agg = new Map();
  days.forEach((day, di) => {
    const half = di < 4 ? 1 : 2;
    day.meals.forEach(m => m.d.forEach(dish => {
      const ing = table[dish];
      if (!ing) return;
      ing.forEach(([cat,name,badge,unit,qty,note]) => {
        const trip = isPantry(cat,name) ? 1 : half;
        const k = `${trip}|${name}|${unit}`;
        if (!agg.has(k)) agg.set(k, [cat,name,badge,unit,qty,note,trip]);
        else { const cur = agg.get(k); cur[4] = (cur[4] === null || qty === null) ? null : cur[4] + qty; }
      });
    }));
  });
  return [...agg.values()].sort((a,b) => a[6]-b[6] || catRank(a[0])-catRank(b[0]) || a[1].localeCompare(b[1]));
}
function generateWeek(plan) {
  const pool = {}, seen = {};
  SLOTS.forEach(s => { pool[s] = []; seen[s] = new Set(); });
  plan.weeks.filter(w => !String(w.id).startsWith("g")).forEach(w => w.days.forEach(day => day.meals.forEach(m => {
    if (!pool[m.t]) return;
    const dishes = m.d.filter(x => x.trim());
    if (!dishes.length || dishes.some(x => x.toLowerCase().includes("ресторан"))) return;
    const key = dishes.join("|");
    if (seen[m.t].has(key)) return;
    seen[m.t].add(key); pool[m.t].push(dishes);
  })));
  const used = {}; SLOTS.forEach(s => used[s] = new Set());
  const days = [];
  BLOCKS.forEach(block => {
    const meals = [];
    SLOTS.forEach(s => {
      if (!pool[s].length) return;
      const fresh = pool[s].filter(o => !used[s].has(o.join("|")));
      const opts = fresh.length ? fresh : pool[s];
      const ch = opts[Math.floor(Math.random()*opts.length)];
      used[s].add(ch.join("|"));
      meals.push({t:s, d:[...ch]});
    });
    block.forEach(name => days.push({name, meals: meals.map(m => ({t:m.t, d:[...m.d]}))}));
  });
  return { id:"g"+Date.now(), label:"Своё меню", dates:new Date().toLocaleDateString("ru-RU"),
           accent:"#5A6E4A", note:"Блюда повторяются по два дня — готовим один раз на два приёма.",
           days, shop: shopForDays(days, plan.dish_ingredients) };
}

/* ================= ПРИЛОЖЕНИЕ ================= */
function App() {
  const [st, setSt] = useState(null);
  const [err, setErr] = useState(null);
  const [tab, setTab] = useState("today");
  const [sheet, setSheet] = useState(null);
  const [openRec, setOpenRec] = useState(null);
  const [busy, setBusy] = useState(false);

  const load = async () => {
    try { setSt(await api("state", {})); setErr(null); }
    catch (e) { setErr(e.message); }
  };
  useEffect(() => { tg?.ready(); tg?.expand(); load(); }, []);

  const act = async (payload) => {
    setBusy(true);
    try { setSt(await api("act", payload)); setErr(null); }
    catch (e) { setErr(e.message); }
    finally { setBusy(false); }
  };

  if (err) return html`<div class="boot"><p>${err}</p><button class="btn" onClick=${load}>Ещё раз</button></div>`;
  if (!st) return html`<div class="boot">Загружаю…</div>`;

  const plans = st.plan.weeks;
  const active = plans.find(w => w.id === st.user.active) || plans[0];
  const people = st.user.people;
  const now = new Date();
  const todayName = WEEKDAYS[(now.getDay()+6)%7];
  const today = active?.days.find(d => d.name === todayName);

  return html`
    <div class="root" style=${{"--accent": active?.accent || "#33624F"}}>
      <header class="hdr">
        <div class="hdr-in">
          <div class="brand">
            <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
              <circle cx="50" cy="50" r="40" fill="var(--brand)"/>
              <circle cx="50" cy="50" r="32.8" fill="none" stroke="var(--bg)" stroke-width="1.3"/>
              <path d="M35.8 50.9 L45.8 60.6 L64.7 40.2" fill="none" stroke="var(--bg)" stroke-width="7.2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="67.4" cy="31.7" r="3.2" fill="var(--amber)"/>
            </svg>
            <div>
              <h1>Питание</h1>
              <p class="hdr-sub">${todayName}, ${now.getDate()} ${MONTHS[now.getMonth()]}</p>
            </div>
          </div>
          <div class="hdr-right">
            <div class="counter">
              <button onClick=${() => act({action:"people", value: Math.max(1, people-1)})}>−</button>
              <span class="num">${people}</span>
              <button onClick=${() => act({action:"people", value: Math.min(12, people+1)})}>+</button>
            </div>
            <button class="gear" onClick=${() => setSheet("settings")}>⚙</button>
          </div>
        </div>
        <nav class="tabs">
          ${[["today","Сегодня"],["menu","Меню"],["shop","Закупки"],["rec","Рецепты"]].map(([k,l]) =>
            html`<button class=${tab===k?"on":""} onClick=${() => setTab(k)}>${l}</button>`)}
        </nav>
        ${busy && html`<div class="busy"></div>`}
      </header>

      <main class="main">
        ${tab==="today" && html`<${Today} plan=${active} day=${today} supps=${st.user.supps}
            people=${people} table=${st.plan.dish_ingredients} recipes=${st.plan.recipes}
            onRecipe=${setOpenRec} onPick=${() => setSheet("settings")}/>`}
        ${tab==="menu" && html`<${Menu} plans=${plans} activeId=${st.user.active} supps=${st.user.supps}
            onActivate=${wid => act({action:"active", wid, today:new Date().toISOString().slice(0,10)})}
            onRecipe=${setOpenRec} onGenerate=${() => setSheet("gen")}/>`}
        ${tab==="shop" && html`<${Shop} st=${st} plans=${plans} act=${act}/>`}
        ${tab==="rec" && html`<${Recipes} list=${st.plan.recipes} act=${act}/>`}
      </main>

      ${openRec && html`<${Sheet} title=${st.plan.recipes.find(r=>r.id===openRec)?.name} onClose=${()=>setOpenRec(null)}>
        <${RecipeBody} r=${st.plan.recipes.find(r=>r.id===openRec)}/>
      <//>`}
      ${sheet==="settings" && html`<${Settings} st=${st} plans=${plans} act=${act}
          onClose=${()=>setSheet(null)} onSupps=${()=>setSheet("supps")} onGen=${()=>setSheet("gen")}/>`}
      ${sheet==="supps" && html`<${Supps} st=${st} act=${act} onClose=${()=>setSheet("settings")}/>`}
      ${sheet==="gen" && html`<${Generate} plan=${st.plan} act=${act} onClose=${()=>setSheet(null)}/>`}
    </div>`;
}

/* ---------- сегодня ---------- */
function Today({ plan, day, supps, people, table, recipes, onRecipe, onPick }) {
  const [cookDays, setCookDays] = useState(null);   // null — на весь блок
  useEffect(() => setCookDays(null), [day?.name, plan?.id]);
  if (!plan || !day) return html`<div class="empty"><p>Меню на сегодня не выбрано.</p>
    <button class="btn" onClick=${onPick}>Выбрать меню</button></div>`;
  const c = cookPlan(plan, day, people, table, cookDays);
  return html`<section>
    <div class="stamp-row">
      <span class=${"stamp " + (c.repeat ? "stamp-keep" : "stamp-cook")}>
        ${c.repeat ? "Готовить не нужно" : c.days > 1 ? `Готовим на ${c.days} дня` : "Готовим сегодня"}</span>
      <span class="stamp-note">${plan.label}</span>
    </div>

    ${c.repeat && !cookDays && html`
      <div class="cook cook-quiet">
        <div class="cook-n">Сегодня то же, что вчера — готовить заново не нужно.</div>
        <button class="btn btn-ghost" onClick=${() => setCookDays(1)}>Всё же приготовить на сегодня</button>
      </div>`}

    ${(!c.repeat || cookDays) && c.items.length > 0 && html`
      <div class="cook">
        <div class="cook-h">Что приготовить${c.days > 1 ? ` — сразу на ${c.days} дня` : " — на сегодня"}
          <span class="cook-sub">на ${people} чел.</span></div>
        ${c.block > 1 && html`<div class="cook-switch">
          <button class=${c.days === 1 ? "on" : ""} onClick=${() => setCookDays(1)}>На сегодня</button>
          <button class=${c.days > 1 ? "on" : ""} onClick=${() => setCookDays(null)}>На ${c.block} дня</button>
        </div>`}
        ${c.items.map(it => html`
          <div class=${"cook-row" + (it.rid ? " cook-rec" : "")}
               onClick=${it.rid ? () => onRecipe(it.rid) : null}>
            <div class="cook-n">${it.name}
              <span class="cook-d">${[...it.slots].join(", ").toLowerCase()}
                ${it.portions > 1 ? ` · ${it.base ? it.base + " " + it.baseUnit + " × " : ""}${it.portions}` : ""}</span></div>
            <div class="cook-q">
              ${it.total > 0 && html`<b class="mono">${it.total} ${it.unit}</b>`}
              ${it.dryTotal > 0 && html`<span class="cook-out mono">сварить ${it.dryTotal} г сухой</span>`}
              ${it.rawTotal > 0 && html`<span class="cook-out mono">взять ${it.rawTotal} г сырого</span>`}
              ${it.rid && html`<span class="cook-link">рецепт →</span>`}
            </div>
          </div>`)}
      </div>`}

    <${DayCard} day=${day} supps=${supps} onRecipe=${onRecipe} big=${true}/>
  </section>`;
}

function DayCard({ day, supps, onRecipe, big }) {
  const byslot = {};
  (supps||[]).forEach(s => (s.slots||"").split(",").filter(Boolean).forEach(sl => (byslot[sl] = byslot[sl]||[]).push(s)));
  Object.values(byslot).forEach(l => l.sort((a,b) => TIMING_ORDER.indexOf(a.timing||"") - TIMING_ORDER.indexOf(b.timing||"")));
  return html`<article class=${"day" + (big ? " day-big" : "")}>
    <div class="day-name">${day.name}</div>
    ${day.meals.map(m => {
      const extra = byslot[m.t] || [];
      if (!m.d.length && !extra.length) return null;
      return html`<div class="meal">
        <div class="slot">${m.t}</div>
        <ul class="dishes">
          ${m.d.map(dish => {
            const [name, amt] = splitDish(dish);
            const rid = recipeIdFor(dish);
            return html`<li><span class="d-name">${name}
              ${rid && html`<button class="rx" onClick=${() => onRecipe(rid)}>рецепт</button>`}
            </span><span class="dose">${amt}</span></li>`;
          })}
          ${extra.map(s => html`<li class="supp-li"><span class="d-name">💊 ${s.name}</span>
            <span class="dose">${[s.dose, TIMING[s.timing||""]].filter(Boolean).join(" · ")}</span></li>`)}
        </ul></div>`;
    })}
  </article>`;
}

/* ---------- меню ---------- */
function Menu({ plans, activeId, supps, onActivate, onRecipe, onGenerate }) {
  const [openId, setOpenId] = useState(activeId || plans[0]?.id);
  const plan = plans.find(p => p.id === openId) || plans[0];
  const blocks = [];
  plan.days.forEach(d => {
    const last = blocks[blocks.length-1];
    if (last && sameMeals(last[0], d)) last.push(d); else blocks.push([d]);
  });
  return html`<section>
    <div class="chips">
      ${plans.map(p => html`<button class=${"chip"+(p.id===openId?" on":"")} style=${{"--c":p.accent}}
        onClick=${() => setOpenId(p.id)}>${p.label}</button>`)}
      <button class="chip chip-add" onClick=${onGenerate}>+ собрать своё</button>
    </div>
    <div class="planbar" style=${{"--c":plan.accent}}>
      <div><div class="planbar-t">${plan.label}</div>
        ${plan.dates && html`<div class="planbar-d">${plan.dates}</div>`}</div>
      <button class=${"btn " + (plan.id===activeId?"btn-on":"")} onClick=${() => onActivate(plan.id)}>
        ${plan.id===activeId ? "Текущее" : "Сделать текущим"}</button>
    </div>
    ${plan.note && html`<p class="note">${plan.note}</p>`}
    ${blocks.map(block => html`
      <div class=${"block" + (block.length>1 ? " block-pair" : "")} style=${{"--c":plan.accent}}>
        ${block.length>1 && html`<div class="block-rail"><span>готовим один раз</span></div>`}
        <div class="block-days">
          ${block.map(d => html`<${DayCard} day=${d} supps=${supps} onRecipe=${onRecipe}/>`)}
        </div></div>`)}
  </section>`;
}

/* ---------- закупки ---------- */
function Shop({ st, plans, act }) {
  const [planId, setPlanId] = useState(st.user.active || plans[0]?.id);
  const [open, setOpen] = useState([]);          // раскрытые заходы
  const [byStore, setByStore] = useState(false);
  const [hide, setHide] = useState(false);
  const [adding, setAdding] = useState(null);    // в какой заход дописываем
  const [draft, setDraft] = useState("");
  const [copied, setCopied] = useState(null);
  const plan = plans.find(p => p.id === planId) || plans[0];
  const people = st.user.people;
  const checks = new Set(st.user.checks);

  const items = useMemo(() => {
    const base = (plan.shop||[]).map((it,i) => ({iid:`${plan.id}:${i}`, cat:it[0], name:it[1], badge:it[2],
      unit:it[3], qty:it[4], note:it[5], trip:it[6]??1, eid:null}));
    const mine = st.user.extras.filter(e => e.wid === plan.id).map(e => ({iid:`${plan.id}:x${e.eid}`,
      cat:"Своё", name:e.name, badge:"", unit:"", qty:null, note:"", trip:e.trip, eid:e.eid}));
    return [...base, ...mine];
  }, [plan, st.user.extras]);

  const inTrip = (it,t) => t==="p" ? PREORDER.includes(storeOf(it.badge,it.cat)) : it.trip===t;
  const done = iid => checks.has(iid);
  const toggleOpen = id => setOpen(o => o.includes(id) ? o.filter(x => x !== id) : [...o, id]);

  const copyList = (t, left) => {
    const meta = TRIPS.find(x => x.id === t);
    const lines = [`${plan.label} · ${meta.name} · на ${people} чел.`];
    let last = null;
    [...left].sort((a,b) => storeRank(storeOf(a.badge,a.cat))-storeRank(storeOf(b.badge,b.cat)) || a.name.localeCompare(b.name))
      .forEach(it => {
        const s = storeOf(it.badge,it.cat);
        if (s !== last) { lines.push("\n" + s + ":"); last = s; }
        const q = fmtQty(it.qty, it.unit, people);
        lines.push(`• ${it.name}${q ? " — " + q : ""}`);
      });
    navigator.clipboard?.writeText(lines.join("\n"));
    setCopied(t); setTimeout(() => setCopied(null), 1800);
  };

  const totalDone = items.filter(i => done(i.iid)).length;

  return html`<section>
    <div class="chips">${plans.map(p => html`<button class=${"chip"+(p.id===planId?" on":"")}
      style=${{"--c":p.accent}} onClick=${() => { setPlanId(p.id); setOpen([]); }}>${p.label}</button>`)}</div>

    <div class="gauge" style=${{"--c":plan.accent}}>
      <div class="gauge-top"><span>Куплено</span><span class="mono">${totalDone} / ${items.length}</span></div>
      <div class="gauge-bar"><i style=${{width:(items.length ? totalDone/items.length*100 : 0)+"%"}}></i></div>
      <div class="gauge-sub">на ${people} чел.</div>
    </div>

    ${open.length > 0 && html`<div class="toolbar">
      <button class=${byStore?"tool on":"tool"} onClick=${() => setByStore(!byStore)}>По магазинам</button>
      <button class=${hide?"tool on":"tool"} onClick=${() => setHide(!hide)}>Скрыть купленное</button>
    </div>`}

    <div class="trips">${TRIPS.map(t => {
      const sel = items.filter(i => inTrip(i,t.id));
      if (!sel.length) return null;
      const left = sel.filter(i => !done(i.iid));
      const isOpen = open.includes(t.id);
      let shown = hide ? left : sel;
      shown = byStore
        ? [...shown].sort((a,b) => storeRank(storeOf(a.badge,a.cat))-storeRank(storeOf(b.badge,b.cat)) || a.name.localeCompare(b.name))
        : [...shown].sort((a,b) => catRank(a.cat)-catRank(b.cat));
      const groups = [];
      shown.forEach(it => {
        const key = byStore ? storeOf(it.badge,it.cat) : it.cat;
        const g = groups[groups.length-1];
        if (g && g.key === key) g.items.push(it); else groups.push({key, items:[it]});
      });
      return html`<div class=${"trip-box"+(isOpen?" open":"")} style=${{"--c":plan.accent}}>
        <button class="trip" onClick=${() => toggleOpen(t.id)}>
          <div class="trip-l"><div class="trip-n">${t.name}</div><div class="trip-w">${t.when}</div></div>
          <div class="trip-r">
            <span class=${"trip-c mono"+(left.length===0?" ok":"")}>
              ${left.length===0 ? "готово" : `${left.length} / ${sel.length}`}</span>
            <span class="chev">▾</span>
          </div>
        </button>

        ${isOpen && html`<div class="trip-body">
          ${t.id==="p" && html`<p class="note note-warn">Это не берётся по дороге: рыба и мясо — у поставщика, остальное едет доставкой.</p>`}
          ${groups.map(g => html`<div class="grp"><h3 class="grp-h">${g.key}</h3>
            <div class="grp-body">${g.items.map(it => html`
              <label class=${"row"+(done(it.iid)?" done":"")}>
                <input type="checkbox" checked=${done(it.iid)} onChange=${() => act({action:"toggle", iid:it.iid})}/>
                <span class="tick"></span>
                <span class="row-main"><span class="row-n">${it.name}</span>
                  <span class="row-m">${!byStore && html`<span class="tag">${storeOf(it.badge,it.cat)}</span>`}
                    ${it.note && html`<span class="row-note">${it.note}</span>`}</span></span>
                <span class="row-q mono">${fmtQty(it.qty,it.unit,people) || "—"}</span>
                ${it.eid && html`<button class="del" onClick=${e => { e.preventDefault();
                  act({action:"extra_del", wid:plan.id, eid:it.eid}); }}>×</button>`}
              </label>`)}</div></div>`)}
          ${hide && !left.length && html`<p class="done-all">Всё куплено.</p>`}

          ${adding === t.id ? html`<div class="add">
              <textarea rows="3" value=${draft} onInput=${e => setDraft(e.target.value)}
                placeholder="Что дописать? Каждый пункт с новой строки"></textarea>
              <div class="add-btns">
                <button class="btn" onClick=${() => {
                  const names = draft.split("\n").map(x=>x.trim()).filter(Boolean);
                  if (names.length) act({action:"extra_add", wid:plan.id, trip: t.id==="p"?1:t.id, names});
                  setDraft(""); setAdding(null);
                }}>Добавить</button>
                <button class="btn btn-ghost" onClick=${() => { setDraft(""); setAdding(null); }}>Отмена</button>
              </div></div>`
            : html`<div class="add-btns">
                <button class="btn btn-ghost" onClick=${() => setAdding(t.id)}>Дописать своё</button>
                <button class="btn btn-ghost" onClick=${() => copyList(t.id, left)}>
                  ${copied===t.id ? "Скопировано" : "Скопировать"}</button>
              </div>`}
        </div>`}
      </div>`;
    })}</div>

    <button class="btn btn-wide" onClick=${() => act({action:"reset", ids: items.map(i=>i.iid)})}>Снять все отметки</button>
  </section>`;
}

/* ---------- рецепты ---------- */
function RecipeBody({ r }) {
  if (!r) return null;
  if (r.text) return html`<p class="own">${r.text}</p>`;
  return html`<div>
    ${r.out && html`<p class="card-out mono">${r.out}</p>`}
    <h4>Ингредиенты</h4><ul class="bul">${(r.ing||[]).map(x => html`<li>${x}</li>`)}</ul>
    <h4>Приготовление</h4><ol class="steps">${(r.steps||[]).map(x => html`<li>${x}</li>`)}</ol>
    ${(r.tips||[]).length > 0 && html`<div><h4>Советы</h4><ul class="bul">${r.tips.map(x => html`<li>${x}</li>`)}</ul></div>`}
  </div>`;
}
function Recipes({ list, act }) {
  const [edit, setEdit] = useState(null);
  const [text, setText] = useState("");
  return html`<section>${list.map(r => html`<article class="card">
    <div class="card-h"><h3>${r.name}</h3></div>
    ${edit === r.id ? html`<div class="add">
        <textarea rows="10" value=${text} onInput=${e => setText(e.target.value)}></textarea>
        <div class="add-btns">
          <button class="btn" onClick=${() => { act({action:"recipe_save", rid:r.id, text}); setEdit(null); }}>Сохранить</button>
          <button class="btn btn-ghost" onClick=${() => setEdit(null)}>Отмена</button>
        </div></div>`
      : html`<div><${RecipeBody} r=${r}/>
        <button class="btn btn-ghost" onClick=${() => { setEdit(r.id); setText(r.text||""); }}>Изменить</button></div>`}
  </article>`)}</section>`;
}

/* ---------- шторки ---------- */
function Sheet({ title, onClose, children }) {
  return html`<div class="sheet-wrap" onClick=${onClose}>
    <div class="sheet" onClick=${e => e.stopPropagation()}>
      <div class="sheet-h"><h2>${title}</h2><button class="x" onClick=${onClose}>×</button></div>
      ${children}
    </div></div>`;
}

function Settings({ st, plans, act, onClose, onSupps, onGen }) {
  const people = st.user.people;
  return html`<${Sheet} title="Настройки" onClose=${onClose}>
    <h4>Едоков</h4>
    <div class="counter counter-big">
      <button onClick=${() => act({action:"people", value: Math.max(1,people-1)})}>−</button>
      <span class="num">${people}</span>
      <button onClick=${() => act({action:"people", value: Math.min(12,people+1)})}>+</button>
    </div>
    <p class="hint">Пересчитывает количества в закупках.</p>
    <h4>Текущее меню</h4>
    <div class="chips">${plans.map(p => html`<button class=${"chip"+(p.id===st.user.active?" on":"")}
      style=${{"--c":p.accent}} onClick=${() => act({action:"active", wid:p.id, today:new Date().toISOString().slice(0,10)})}>
      ${p.label}</button>`)}</div>
    <p class="hint">По нему строится вкладка «Сегодня» и напоминания в боте.</p>
    <h4>Ещё</h4>
    <button class="btn btn-wide" onClick=${onSupps}>Биодобавки (${st.user.supps.length})</button>
    <button class="btn btn-wide" onClick=${onGen}>Собрать своё меню</button>
  <//>`;
}

function Supps({ st, act, onClose }) {
  const [name, setName] = useState("");
  const [dose, setDose] = useState("");
  const toggleSlot = (sp, slot) => {
    const cur = (sp.slots||"").split(",").filter(Boolean);
    const next = cur.includes(slot) ? cur.filter(x => x !== slot) : [...cur, slot];
    act({action:"supp_slots", sid:sp.sid, slots: SLOTS.filter(x => next.includes(x)).join(",")});
  };
  return html`<${Sheet} title="Биодобавки" onClose=${onClose}>
    <p class="hint">Появятся в меню дня рядом с тем приёмом пищи, к которому привязаны.</p>
    ${st.user.supps.map(sp => html`<div class="supp">
      <div class="supp-h"><div><b>${sp.name}</b>${sp.dose && html`<span class="dose mono"> ${sp.dose}</span>`}</div>
        <button class="del" onClick=${() => act({action:"supp_del", sid:sp.sid})}>×</button></div>
      <div class="slots">${SLOTS.map(sl => html`<button
        class=${"slot-b"+((sp.slots||"").split(",").includes(sl)?" on":"")}
        onClick=${() => toggleSlot(sp, sl)}>${sl}</button>`)}</div>
      <div class="slots">${Object.keys(TIMING).map(k => html`<button
        class=${"slot-b t"+((sp.timing||"")===k?" on":"")}
        onClick=${() => act({action:"supp_timing", sid:sp.sid, timing:(sp.timing||"")===k?"":k})}>
        ${TIMING[k]}</button>`)}</div>
    </div>`)}
    <h4>Добавить</h4>
    <div class="add">
      <input value=${name} onInput=${e => setName(e.target.value)} placeholder="Омега-3"/>
      <input value=${dose} onInput=${e => setDose(e.target.value)} placeholder="2 капсулы"/>
      <button class="btn" onClick=${() => { if (name.trim()) { act({action:"supp_add", name, dose}); setName(""); setDose(""); } }}>Добавить</button>
    </div>
  <//>`;
}

function Generate({ plan, act, onClose }) {
  const [w, setW] = useState(() => generateWeek(plan));
  return html`<${Sheet} title="Своё меню" onClose=${onClose}>
    <p class="hint">${w.note} Блюда взяты из планов, которые ты уже ешь.</p>
    ${w.days.filter((_,i) => [0,2,4,6].includes(i)).map(d => html`<div class="gen-day">
      <div class="gen-name">${d.name}${["Понедельник","Среда","Пятница"].includes(d.name) ? " и следующий день" : ""}</div>
      ${d.meals.map(m => html`<div class="gen-meal"><span class="slot">${m.t}</span>
        <span>${m.d.map(x => splitDish(x)[0]).join(", ")}</span></div>`)}
    </div>`)}
    <div class="add-btns">
      <button class="btn" onClick=${() => { act({action:"gen_save", week:w}); onClose(); }}>Сохранить меню</button>
      <button class="btn btn-ghost" onClick=${() => setW(generateWeek(plan))}>Другой вариант</button>
    </div>
  <//>`;
}

const root = document.getElementById("app");
root.innerHTML = "";                       // убираем заглушку «Загружаю…»
render(html`<${App}/>`, root);
</script>
</body>
</html>
